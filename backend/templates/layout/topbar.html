      <li class="dropdown notification-list">
        <a
          class="nav-link dropdown-toggle arrow-none"
          data-bs-toggle="dropdown"
          href="#"
          role="button"
          aria-haspopup="false"
          aria-expanded="false"
        >
          <i class="ri-notification-3-line font-22"></i>
          <span class="position-absolute start-100 translate-middle badge rounded-pill bg-danger d-none"> 0 </span>
        </a>
        <div class="dropdown-menu dropdown-menu-end dropdown-menu-animated dropdown-lg py-0">
          <div class="p-2 border-top-0 border-start-0 border-end-0 border-dashed border">

              <div class="col">
                <h6 class="m-0 font-16 fw-semibold">Notificaciones</h6>
              </div>
            </div>

          data-bs-toggle="dropdown"
          href="#"
          role="button"
          aria-haspopup="false"
          aria-expanded="false"
        >
          <span class="account-user-avatar">
            <img
              src="{% if request.user.colaborador.foto %}{{ request.user.colaborador.foto.url }}{% else %}{% static 'images/avatar-1.svg' %}{% endif %}"
              alt="user-image"
              width="32"
              class="rounded-circle"
            />
          </span>

          <span class="d-lg-flex flex-column gap-1 d-none">
            <h5 class="my-0">{{ user }}</h5>
            <h6 class="my-0 fw-normal">
              {% if user.colaborador.area %} {{ user.colaborador.area.nombre }}
              {% else %} Área no asignada {% endif %}
            </h6>
          </span>
        </a>
        <div class="dropdown-menu dropdown-menu-end dropdown-menu-animated profile-dropdown">
          <div class="dropdown-header noti-title">
            <h6 class="text-overflow m-0">¡Bienvenido!</h6>
          </div>
          <a href="{% url "perfil" user.id %}" class="dropdown-item">
            <i class="mdi mdi-account-circle me-1"></i>
            <span>Cuenta</span>
          </a>
          <a href="{% url 'admin:index' %}" class="dropdown-item">
            <i class="mdi mdi-account-circle me-1"></i>
            <span>Admin</span>
          </a>
          <a href="{% url "logout" %}" class="dropdown-item">
            <i class="mdi mdi-logout me-1"></i>
            <span>Cerrar Sesión</span>
          </a>
        </div>
      </li>

  </div>
</div>
<div class="modal fade" id="centermodal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <div class="input-group">
                    <span class="input-group-text border-0 bg-transparent">
                        <i class="ri-search-line"></i>
                    </span>
                    <input type="text" class="form-control border-0" id="modal-search-input" placeholder="Buscar OTs..." autocomplete="off">
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div id="search-results" style="max-height: 350px; overflow-y: auto;" class="p-0">
                    <div class="p-3 text-center">
                        <p class="text-muted mb-0">Escribe para comenzar a buscar...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
