<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvas" aria-labelledby="offcanvas">
  <div class="offcanvas-header">
    {{form.titulo}}
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  
  <div class="offcanvas-body d-flex flex-column">
    <form class="form-horizontal" id="form-editar-tarea" data-task-id="">
      
      <div class="row mb-3">
        <div class="col">{{form.descripcion}}</div>
      </div>
      <div class="row mb-3">
        <label for="responsables" class="col-3 col-form-label">Responsables</label>
        <div class="col-9">{{form.responsables}}
        </div>
      </div>

      {% if user.is_superuser %}
      <div class="row mb-3">
        <label for="inputPassword3" class="col-3 col-form-label">Vencimiento</label>
        <div class="col-9">{{form.vencimiento}}</div>
      </div>
      {% endif %}
      <div class="row mb-3">
        <label for="duracion" class="col-3 col-form-label">Tiempo estimado</label>
        <div class="col-9">{{form.duracion}}</div>
      </div>

      <div class="row mb-3">
        <label for="registrado" class="col-3 col-form-label">Tiempo registrado</label>
        <div class="col-9">
            <input type="text" readonly class="form-control-plaintext" id="registrado" >
        </div>
      </div>
      <div class="row mb-3">
        <label for="inputEmail3" class="col-3 col-form-label">Creacion</label>
        <div class="col-9">
          <input type="date" readonly class="form-control-plaintext" id="creacion" />
        </div>
      </div>

    </form>

    <div class="mt-auto border-top pt-3">
      <button class="btn btn-primary" id="btnIniciarKanban">Iniciar actividad</button>
    </div>
  </div>
</div>
